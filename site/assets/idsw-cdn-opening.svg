<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="Illustrative opening-time graph: CDN requests spike when the queue opens and decay, while server position requests stay flat at zero">
<rect width="680" height="340" fill="#fffdf8"/>
<g font-family="system-ui,sans-serif" fill="#202b29">
<line x1="60" y1="280" x2="640" y2="280" stroke="#bbc8c0" stroke-width="2"/>
<line x1="60" y1="280" x2="60" y2="40" stroke="#bbc8c0" stroke-width="2"/>
<line x1="200" y1="280" x2="200" y2="50" stroke="#597269" stroke-width="2" stroke-dasharray="6 5"/>
<text x="208" y="60" font-size="14" fill="#597269">t: queue opens</text>
<path d="M200 278 C 212 120, 224 90, 240 92 C 262 96, 268 220, 320 262 C 350 278, 420 279, 460 279" stroke="#156c60" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
<line x1="60" y1="272" x2="640" y2="272" stroke="#b3261e" stroke-width="3"/>
<line x1="420" y1="70" x2="470" y2="70" stroke="#156c60" stroke-width="3" stroke-dasharray="7 5"/>
<text x="480" y="75" font-size="14">requests to CDN: one shared document for everyone</text>
<line x1="420" y1="100" x2="470" y2="100" stroke="#b3261e" stroke-width="3"/>
<text x="480" y="105" font-size="14">position requests to server: 0</text>
<text x="640" y="305" font-size="13" text-anchor="end" fill="#597269">time (seconds)</text>
<text x="60" y="330" font-size="14" font-weight="600" fill="#7a6a1f">The slide marks this plot as an illustration; it is not a measurement.</text>
</g>
</svg>
