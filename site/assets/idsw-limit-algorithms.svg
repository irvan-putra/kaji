<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-label="The slide's limiter progression: fixed, then AIMD, then Vegas, then gradient, with Netflix concurrency-limits named as the example library">
<rect width="680" height="210" fill="#fffdf8"/>
<g font-family="system-ui,sans-serif" fill="#202b29">
<text x="20" y="34" font-size="17" font-weight="600">Then add a concurrency limit</text>
<text x="20" y="56" font-size="13" fill="#597269">Example named on the slide: Netflix concurrency-limits</text>
<line x1="70" y1="120" x2="620" y2="120" stroke="#bbc8c0" stroke-width="2"/>
<g font-size="13" fill="#597269" text-anchor="middle">
<text x="80" y="100">01</text><text x="250" y="100">02</text><text x="420" y="100">03</text><text x="590" y="100">04</text>
</g>
<g fill="#156c60"><circle cx="80" cy="120" r="6"/><circle cx="250" cy="120" r="6"/><circle cx="420" cy="120" r="6"/><circle cx="590" cy="120" r="6"/></g>
<g font-size="16" font-weight="600" text-anchor="middle">
<text x="80" y="155">Fixed</text><text x="250" y="155">AIMD</text><text x="420" y="155">Vegas</text><text x="590" y="155">Gradient</text>
</g>
<text x="20" y="195" font-size="13" font-weight="600" fill="#7a6a1f">Recreated from the photographed slide: the labels are the slide's, the styling is ours.</text>
</g>
</svg>
