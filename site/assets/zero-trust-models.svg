<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" role="img" aria-label="Three OpenZiti deployment models and where the identity check sits">
<rect width="680" height="720" fill="#fffdf8"/>
<g font-family="system-ui,sans-serif" fill="#202b29">
<text x="20" y="52" font-size="27" font-weight="700">1. Network access</text>
<rect x="20" y="80" width="150" height="78" rx="12" fill="#f4f1eb" stroke="#bbc8c0"/>
<text x="95" y="112" font-size="20" text-anchor="middle">Client</text>
<text x="95" y="136" font-size="17" text-anchor="middle" fill="#597269">any network</text>
<path d="M176 119 h44" stroke="#156c60" stroke-width="3" marker-end="url(#a)"/>
<rect x="228" y="80" width="220" height="78" rx="12" fill="#dfece6" stroke="#156c60"/>
<text x="338" y="112" font-size="20" text-anchor="middle" font-weight="600">Edge router</text>
<text x="338" y="136" font-size="17" text-anchor="middle" fill="#2f4f47">identity + policy check</text>
<path d="M454 119 h44" stroke="#156c60" stroke-width="3" marker-end="url(#a)"/>
<rect x="506" y="80" width="154" height="78" rx="12" fill="#f4f1eb" stroke="#bbc8c0"/>
<text x="583" y="112" font-size="20" text-anchor="middle">Service</text>
<text x="583" y="136" font-size="16" text-anchor="middle" fill="#597269">still on a port</text>
<text x="20" y="196" font-size="17" fill="#597269">No code changes. Inside the zone, the port is still reachable.</text>
<text x="20" y="292" font-size="27" font-weight="700">2. Host access</text>
<rect x="20" y="320" width="150" height="78" rx="12" fill="#f4f1eb" stroke="#bbc8c0"/>
<text x="95" y="352" font-size="20" text-anchor="middle">Client</text>
<text x="95" y="376" font-size="17" text-anchor="middle" fill="#597269">any network</text>
<path d="M176 359 h44" stroke="#156c60" stroke-width="3" marker-end="url(#a)"/>
<rect x="228" y="320" width="220" height="78" rx="12" fill="#dfece6" stroke="#156c60"/>
<text x="338" y="352" font-size="20" text-anchor="middle" font-weight="600">Tunneler</text>
<text x="338" y="376" font-size="17" text-anchor="middle" fill="#2f4f47">identity on the host</text>
<path d="M454 359 h44" stroke="#156c60" stroke-width="3" marker-end="url(#a)"/>
<rect x="506" y="320" width="154" height="78" rx="12" fill="#f4f1eb" stroke="#bbc8c0"/>
<text x="583" y="352" font-size="20" text-anchor="middle">Service</text>
<text x="583" y="376" font-size="16" text-anchor="middle" fill="#597269">localhost only</text>
<text x="20" y="436" font-size="17" fill="#597269">No code changes. Dark to the LAN; host OS is the boundary.</text>
<text x="20" y="532" font-size="27" font-weight="700">3. Application access</text>
<rect x="20" y="560" width="190" height="78" rx="12" fill="#f4f1eb" stroke="#bbc8c0"/>
<text x="115" y="592" font-size="20" text-anchor="middle">Client SDK</text>
<text x="115" y="616" font-size="17" text-anchor="middle" fill="#597269">holds identity</text>
<path d="M216 599 h84" stroke="#156c60" stroke-width="3" marker-end="url(#a)"/>
<rect x="308" y="560" width="160" height="78" rx="12" fill="#dfece6" stroke="#156c60"/>
<text x="388" y="592" font-size="19" text-anchor="middle" font-weight="600">No listening</text>
<text x="388" y="616" font-size="19" text-anchor="middle" font-weight="600">ports</text>
<path d="M474 599 h24" stroke="#156c60" stroke-width="3" marker-end="url(#a)"/>
<rect x="506" y="560" width="154" height="78" rx="12" fill="#f4f1eb" stroke="#bbc8c0"/>
<text x="583" y="592" font-size="20" text-anchor="middle">Service SDK</text>
<text x="583" y="616" font-size="16" text-anchor="middle" fill="#597269">holds identity</text>
<text x="20" y="676" font-size="17" fill="#597269">Code changes. Strongest; encrypted in-process, end to end.</text>
</g>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#156c60"/></marker></defs>
</svg>