<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="The speaker's ten-registrant shuffle: registration numbers 0 to 9 map to unique positions 1 to 10, registrant 3 first, without a stored table">
<rect width="680" height="300" fill="#fffdf8"/>
<g font-family="system-ui,sans-serif" fill="#202b29">
<text x="20" y="88" font-size="15" fill="#597269">Registration #</text>
<rect x="130" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="154" y="90" font-size="17" text-anchor="middle">#0</text><rect x="182" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="206" y="90" font-size="17" text-anchor="middle">#1</text><rect x="234" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="258" y="90" font-size="17" text-anchor="middle">#2</text><rect x="286" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="310" y="90" font-size="17" text-anchor="middle">#3</text><rect x="338" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="362" y="90" font-size="17" text-anchor="middle">#4</text><rect x="390" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="414" y="90" font-size="17" text-anchor="middle">#5</text><rect x="442" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="466" y="90" font-size="17" text-anchor="middle">#6</text><rect x="494" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="518" y="90" font-size="17" text-anchor="middle">#7</text><rect x="546" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="570" y="90" font-size="17" text-anchor="middle">#8</text><rect x="598" y="60" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="622" y="90" font-size="17" text-anchor="middle">#9</text>
<text x="20" y="148" font-size="15" fill="#597269">Position</text>
<rect x="130" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="154" y="150" font-size="17" text-anchor="middle" font-weight="600">3</text><rect x="182" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="206" y="150" font-size="17" text-anchor="middle" font-weight="600">9</text><rect x="234" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="258" y="150" font-size="17" text-anchor="middle" font-weight="600">10</text><rect x="286" y="120" width="48" height="48" fill="#f4e9b8" stroke="#bbc8c0"/><text x="310" y="150" font-size="17" text-anchor="middle" font-weight="600">1</text><rect x="338" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="362" y="150" font-size="17" text-anchor="middle" font-weight="600">8</text><rect x="390" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="414" y="150" font-size="17" text-anchor="middle" font-weight="600">4</text><rect x="442" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="466" y="150" font-size="17" text-anchor="middle" font-weight="600">7</text><rect x="494" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="518" y="150" font-size="17" text-anchor="middle" font-weight="600">5</text><rect x="546" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="570" y="150" font-size="17" text-anchor="middle" font-weight="600">2</text><rect x="598" y="120" width="48" height="48" fill="#dfece6" stroke="#bbc8c0"/><text x="622" y="150" font-size="17" text-anchor="middle" font-weight="600">6</text>
<text x="20" y="208" font-size="15" fill="#597269">Queue order</text>
<rect x="130" y="180" width="48" height="48" fill="#f4e9b8" stroke="#bbc8c0"/><text x="154" y="210" font-size="17" text-anchor="middle">#3</text><rect x="182" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="206" y="210" font-size="17" text-anchor="middle">#8</text><rect x="234" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="258" y="210" font-size="17" text-anchor="middle">#0</text><rect x="286" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="310" y="210" font-size="17" text-anchor="middle">#5</text><rect x="338" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="362" y="210" font-size="17" text-anchor="middle">#7</text><rect x="390" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="414" y="210" font-size="17" text-anchor="middle">#9</text><rect x="442" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="466" y="210" font-size="17" text-anchor="middle">#6</text><rect x="494" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="518" y="210" font-size="17" text-anchor="middle">#4</text><rect x="546" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="570" y="210" font-size="17" text-anchor="middle">#1</text><rect x="598" y="180" width="48" height="48" fill="#f4f1eb" stroke="#bbc8c0"/><text x="622" y="210" font-size="17" text-anchor="middle">#2</text>
<text x="20" y="268" font-size="15">Registrant #3 is called first. Every position 1-10 is used exactly once, computed, with no position table.</text>
<text x="20" y="290" font-size="13" fill="#597269">The speaker's example values; a unique mapping alone proves neither fairness nor security.</text>
</g>
</svg>
