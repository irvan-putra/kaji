<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="Two request timelines both reading a Rp100,000 balance before either writes Rp50,000, so the final balance wrongly stays Rp50,000">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#597269"/></marker></defs>
<rect width="680" height="320" fill="#fffdf8"/>
<g font-family="system-ui,sans-serif" fill="#202b29">
<rect x="150" y="60" width="280" height="150" fill="#f4e9b8" opacity="0.65"/>
<text x="290" y="230" font-size="14" text-anchor="middle" fill="#7a6a1f">danger window: a few milliseconds</text>
<text x="20" y="115" font-size="18" font-weight="600">Request A</text>
<line x1="150" y1="110" x2="620" y2="110" stroke="#bbc8c0" stroke-width="3"/>
<circle cx="160" cy="110" r="8" fill="#202b29"/>
<text x="160" y="88" font-size="15" text-anchor="start">Read Rp100,000</text>
<circle cx="430" cy="110" r="8" fill="#202b29"/>
<text x="438" y="96" font-size="15">Write Rp50,000</text>
<text x="20" y="185" font-size="18" font-weight="600">Request B</text>
<line x1="150" y1="180" x2="620" y2="180" stroke="#bbc8c0" stroke-width="3"/>
<circle cx="290" cy="180" r="8" fill="#202b29"/>
<text x="290" y="158" font-size="15" text-anchor="middle">Read Rp100,000</text>
<circle cx="520" cy="180" r="8" fill="#b3261e"/>
<text x="470" y="205" font-size="15" fill="#b3261e">Write Rp50,000</text>
<text x="620" y="270" font-size="13" text-anchor="end" fill="#597269">time (milliseconds)</text>
<rect x="20" y="282" width="640" height="1" fill="#bbc8c0"/>
<text x="20" y="310" font-size="17" font-weight="700">Final balance Rp50,000</text>
<text x="660" y="310" font-size="17" text-anchor="end" fill="#597269">should have been Rp0</text>
</g>
</svg>
