<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Illustrative graph without a concurrency limit: response time rises and stays high while new instances come ready, get flooded and die again">
<rect width="680" height="330" fill="#fffdf8"/>
<g font-family="system-ui,sans-serif" fill="#202b29">
<text x="20" y="34" font-size="17" font-weight="600">Without a concurrency limit</text>
<text x="20" y="56" font-size="13" fill="#597269">New instance comes ready, is flooded immediately, dies again</text>
<line x1="60" y1="255" x2="640" y2="255" stroke="#bbc8c0" stroke-width="2"/>
<path d="M60 235 L170 235 L245 115 L285 105 L325 128 L365 112 L405 124 L445 108 L485 122 L525 110 L565 122 L605 112 L640 118" fill="none" stroke="#b3261e" stroke-width="3"/>
<path d="M60 250 H180 V200 H250 M290 250 H340 V205 H395 M440 250 H490 V208 H545 M585 250 H640" fill="none" stroke="#202b29" stroke-width="3"/>
<g stroke="#202b29" stroke-width="3">
<line x1="258" y1="218" x2="274" y2="234"/><line x1="274" y1="218" x2="258" y2="234"/>
<line x1="403" y1="220" x2="419" y2="236"/><line x1="419" y1="220" x2="403" y2="236"/>
<line x1="553" y1="222" x2="569" y2="238"/><line x1="569" y1="222" x2="553" y2="238"/>
</g>
<line x1="60" y1="285" x2="100" y2="285" stroke="#b3261e" stroke-width="3"/>
<text x="108" y="290" font-size="13">response time</text>
<line x1="220" y1="285" x2="260" y2="285" stroke="#202b29" stroke-width="3"/>
<text x="268" y="290" font-size="13">instances ready</text>
<g stroke="#202b29" stroke-width="3"><line x1="392" y1="278" x2="406" y2="292"/><line x1="406" y1="278" x2="392" y2="292"/></g>
<text x="414" y="290" font-size="13">instance died</text>
<text x="640" y="290" font-size="12" text-anchor="end" fill="#597269">illustration · time</text>
<text x="20" y="318" font-size="13" font-weight="600" fill="#7a6a1f">Approximate recreation from a photographed slide. The slide marks it an illustration, not a measurement.</text>
</g>
</svg>
