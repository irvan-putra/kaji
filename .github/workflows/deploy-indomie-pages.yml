name: Deploy Indomie and synthetic Kaji pages to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-indomie-pages.yml'
      - 'examples/indomie/**'
      - 'examples/cook/**'
      - 'examples/economics-synthetic/**'
      - 'examples/tumbuh/**'
      - 'site/**'
      - 'gallery/**'
      - 'tools/build_gallery.py'
      - 'README.md'
      - 'examples/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://vanipy.com/kaji/indomie/
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage the spec at the /indomie path
        run: |
          mkdir -p public/indomie
          cp -R examples/indomie/. public/indomie/
      - name: Stage the cook collection
        run: |
          mkdir -p public/cook
          cp -R examples/cook/. public/cook/
      - name: Stage the synthetic break-even page
        run: |
          mkdir -p public/economics-synthetic
          cp -R examples/economics-synthetic/. public/economics-synthetic/
      - name: Stage Tumbuh archive
        run: |
          mkdir -p public/tumbuh
          cp -R examples/tumbuh/. public/tumbuh/
      - name: Build and stage the kaji home, apk and web galleries
        run: |
          python3 tools/build_gallery.py
          cp -R site/. public/
      - name: Upload selected public pages
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for this attempt's Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request
          url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                 + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100')
          deadline = time.monotonic() + 75
          for delay in [1, 2, 4, 8, 12, 16, 20]:
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [a for a in artifacts if a['name'] == os.environ['EXPECTED_ARTIFACT']
                         and not a['expired']]
              if len(matches) == 1:
                  expected_id = os.environ.get('EXPECTED_ARTIFACT_ID')
                  if expected_id and str(matches[0]['id']) != expected_id:
                      raise SystemExit('Artifact ID mismatch; refusing deployment')
                  print('Exactly one current-attempt artifact is visible')
                  break
              if len(matches) > 1:
                  raise SystemExit('Duplicate current-attempt artifacts; refusing deployment')
              if time.monotonic() + delay > deadline:
                  raise SystemExit('Artifact metadata did not become visible within bound')
              time.sleep(delay)
          else:
              raise SystemExit('Artifact metadata did not become visible within bound')
          PYCODE
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // Use the upload's verified ID, avoiding a second artifact-service lookup.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Missing or invalid uploaded Pages artifact ID');
            }
            const idToken = await core.getIDToken();
            const {data: deployment} = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments', {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: idToken
              });
            const deploymentId = deployment.id || deployment.status_url.split('/').pop();
            const terminal = new Set([
              'deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost'
            ]);
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data: state} = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                  ...context.repo, deployment_id: deploymentId
                });
              core.info(`Pages deployment status: ${state.status}`);
              if (state.status === 'succeed') return;
              if (terminal.has(state.status)) throw new Error(`Pages: ${state.status}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
                ...context.repo, deployment_id: deploymentId
              });
            throw new Error('Pages deployment timed out after 10 minutes');
