name: Deploy Indomie and synthetic Kaji pages to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-indomie-pages.yml'
      - 'examples/indomie/**'
      - 'examples/cook/**'
      - 'examples/economics-synthetic/**'
      - 'examples/tumbuh/**'
      - 'site/**'
      - 'gallery/**'
      - 'tools/build_gallery.py'
      - 'README.md'
      - 'examples/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://vanipy.com/kaji/indomie/
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage the spec at the /indomie path
        run: |
          mkdir -p public/indomie
          cp -R examples/indomie/. public/indomie/
      - name: Stage the cook collection
        run: |
          mkdir -p public/cook
          cp -R examples/cook/. public/cook/
      - name: Stage the synthetic break-even page
        run: |
          mkdir -p public/economics-synthetic
          cp -R examples/economics-synthetic/. public/economics-synthetic/
      - name: Stage Tumbuh archive
        run: |
          mkdir -p public/tumbuh
          cp -R examples/tumbuh/. public/tumbuh/
      - name: Build and stage the kaji home, apk and web galleries
        run: |
          python3 tools/build_gallery.py
          cp -R site/. public/
      - name: Upload selected public pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
