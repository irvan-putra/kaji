name: Deploy Indomie engineering spec at /indomie on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-indomie-pages.yml'
      - 'examples/indomie/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://vanipy.com/kaji/indomie/
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage the spec at the /indomie path
        run: |
          mkdir -p public/indomie
          cp -R examples/indomie/. public/indomie/
      - name: Upload only the Indomie engineering spec
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
